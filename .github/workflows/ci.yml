name: CI

on:
  push:
    branches: [main, "v2/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint (colour, flower, font, module-hue and library caps)
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Contrast cap
        run: pnpm check:contrast
      - name: No-fork cap
        run: pnpm check:drift
      - name: Registry is up to date
        run: pnpm registry:build && git diff --exit-code -- public/r
      - name: Build
        run: pnpm build

      - run: pnpm exec playwright install --with-deps chromium
      - name: Rendered caps (mark integrity, one primary per screen, axe)
        run: pnpm test:e2e
